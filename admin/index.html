<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>Queen's Garden 管理中心</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top">
  <a class="back" href="/">‹ 製作器</a>
  <h1>👑 管理中心</h1>
  <span class="who" id="who"></span>
</header>

<section id="login" class="card login" hidden>
  <h2>管理員登入</h2>
  <p class="muted">只限管理員。所有修改都由伺服器驗證權限。</p>
  <form id="loginForm">
    <label for="pw">管理密碼</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label for="actor">你的名稱（記錄發佈者用）</label>
    <input id="actor" type="text" maxlength="30" placeholder="例如：Sally" autocomplete="nickname">
    <button class="btn primary" type="submit">登入</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </form>
</section>

<main id="app" hidden>
  <div class="bar" id="bar">
    <div class="bar-info" id="barInfo"></div>
    <div class="bar-btns">
      <button class="btn" id="saveDraft" type="button">儲存草稿</button>
      <button class="btn" id="preview" type="button">預覽</button>
      <button class="btn primary" id="publish" type="button">發佈設定</button>
      <button class="btn ghost" id="discard" type="button">捨棄草稿</button>
    </div>
    <p class="msg" id="barMsg" role="status"></p>
  </div>

  <nav class="nav" role="tablist" aria-label="管理分頁">
    <button role="tab" data-v="residents" class="on">居民管理</button>
    <button role="tab" data-v="pages">頁面設定</button>
    <button role="tab" data-v="fonts">字體及文字</button>
    <button role="tab" data-v="assets">相框及素材</button>
    <button role="tab" data-v="copy">宣傳文案</button>
    <button role="tab" data-v="versions">版本紀錄</button>
  </nav>

  <section class="view" id="v-residents"></section>
  <section class="view" id="v-pages" hidden></section>
  <section class="view" id="v-fonts" hidden></section>
  <section class="view" id="v-assets" hidden></section>
  <section class="view" id="v-copy" hidden></section>
  <section class="view" id="v-versions" hidden></section>
  <p class="foot"><button class="btn ghost small" id="logout" type="button">登出</button></p>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="modalTitle"></h2><button class="xbtn" id="modalClose" type="button" aria-label="關閉">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<script src="admin.js"></script>
</body>
</html>
