name: Isolated Cloudflare deployments
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    uses: ./.github/workflows/phase5.yml
  makers:
    uses: ./.github/workflows/calendar.yml
  deploy:
    needs: [api, makers]
    # Keep disabled until both Builds triggers and the migration are reconciled.
    if: >-
      github.event_name != 'pull_request' && vars.QG_AUTODEPLOY_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    concurrency:
      group: qg-deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      QG_DEVELOPMENT_D1_ID: ${{ vars.QG_DEVELOPMENT_D1_ID }}
      QG_TEST_SHEET_ID: ${{ vars.QG_TEST_SHEET_ID }}
      QG_TEST_DRIVE_FOLDER_ID: ${{ vars.QG_TEST_DRIVE_FOLDER_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the explicit isolated target
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/deployment-config.mjs "$TARGET"
          npx wrangler deploy --config ".deployment/$TARGET.json" --dry-run
      - name: Record rollback version before deployment
        run: npx wrangler deployments list --config ".deployment/$TARGET.json" > .deployment/previous-deployments.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rollback-${{ github.sha }}-${{ env.TARGET }}
          path: .deployment/previous-deployments.txt
          retention-days: 90
      - name: Deploy the tested commit (no database migrations)
        run: npx wrangler deploy --config ".deployment/$TARGET.json" --tag "${GITHUB_SHA:0:12}" --message "GitHub Actions $GITHUB_SHA"
