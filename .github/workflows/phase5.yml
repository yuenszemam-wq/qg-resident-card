name: Worker API and admin end-to-end
on:
  workflow_call:
  pull_request:
    paths:
      - 'worker/**'
      - 'admin/**'
      - 'ui/**'
      - 'index.html'
      - 'daily/**'
      - 'weekly/**'
      - 'migrations/**'
      - 'tests/**'
      - 'wrangler.jsonc'
      - 'package*.json'
      - '.github/workflows/phase5.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
  e2e:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm install --no-save playwright@1.56.0
      - name: Local secrets for wrangler dev (throwaway CI password)
        run: |
          HASH=$(node -e "import('./worker/lib/auth.js').then(async m=>console.log(await m.hashPassword('ci-only-password', 20000)))")
          printf 'ADMIN_PASSWORD_HASH="%s"\n' "$HASH" > .dev.vars
      - run: npx wrangler d1 migrations apply qg-resident-card-db --local
      - run: npx wrangler d1 execute qg-resident-card-db --local --file tests/seed-local.sql
      - name: End-to-end (${{ matrix.browser }})
        env:
          QG_ADMIN_PASSWORD: ci-only-password
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler dev --port 8787 >/tmp/dev.log 2>&1 &
          node -e "(async()=>{for(let i=0;i<90;i++){try{if((await fetch('http://127.0.0.1:8787/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e_admin.mjs ${{ matrix.browser }} || (tail -50 /tmp/dev.log; exit 1)
