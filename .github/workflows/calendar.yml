name: Calendar and resident card regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'calendar/**'
      - 'ui/**'
      - 'shadow/**'
      - 'weekly/**'
      - 'daily/**'
      - 'fonts/**'
      - 'video/**'
      - '.github/tests/test_qg_calendar.py'
      - '.github/workflows/calendar.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.56.0
      - name: Test mobile workflows
        run: |
          python -m http.server 8050 --bind 127.0.0.1 >/tmp/qg-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8050/ && break; sleep 1; done
          python .github/tests/test_qg_calendar.py ${{ matrix.browser }}
