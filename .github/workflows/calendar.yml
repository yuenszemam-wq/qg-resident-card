name: Calendar and resident card regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'calendar/**'
      - '.github/tests/test_qg_calendar.py'
      - '.github/workflows/calendar.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test mobile workflows
        run: |
          python -m http.server 8050 --bind 127.0.0.1 >/tmp/qg-server.log 2>&1 &
          for attempt in {1..30}; do curl -fsS -o /dev/null http://127.0.0.1:8050/ && break; sleep 1; done
          python .github/tests/test_qg_calendar.py ${{ matrix.browser }}
